<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="How PolicyEngine UK Chat computes tax and benefit answers with an open microsimulation engine instead of asking a language model to invent figures."
    />
    <title>AI chatbot for policymaking | PolicyEngine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <style>
      .pe-site-header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: #ffffff;
        border-bottom: 1px solid #d8e2e8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .pe-site-header__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        max-width: 1180px;
        margin: 0 auto;
        min-height: 72px;
        padding: 0 24px;
      }

      .pe-site-header__logo {
        display: inline-flex;
        align-items: center;
        min-width: 156px;
      }

      .pe-site-header__logo img {
        display: block;
        width: 156px;
        height: auto;
      }

      .pe-site-header__nav {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 24px;
        color: #2c3e4f;
        font-size: 15px;
        font-weight: 500;
        line-height: 1;
      }

      .pe-site-header__nav a {
        color: inherit;
        text-decoration: none;
        white-space: nowrap;
      }

      .pe-site-header__nav a:hover {
        color: #0c7c8c;
      }

      .pe-site-header__nav .pe-site-header__donate {
        border: 1px solid #0c7c8c;
        border-radius: 4px;
        color: #0c7c8c;
        padding: 9px 14px;
      }

      .pe-site-header__country {
        border-left: 1px solid #d8e2e8;
        margin-left: 4px;
        padding-left: 24px;
      }

      @media (max-width: 760px) {
        .pe-site-header__inner {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
          min-height: 0;
          padding: 16px 20px;
        }

        .pe-site-header__nav {
          flex-wrap: wrap;
          gap: 12px 18px;
          justify-content: flex-start;
          font-size: 14px;
          line-height: 1.25;
        }

        .pe-site-header__country {
          border-left: 0;
          margin-left: 0;
          padding-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
